name: Build and Release

on:
  release:
    types: [created]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: ZanutaRamdiskExtractor
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxcb-cursor-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build
        env:
          SKIP_CODESIGN: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: python build.py

      - name: Verify (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          file "dist/${APP_NAME}"
          timeout 5 "./dist/${APP_NAME}" --help 2>&1 | head -5 || echo "verify: done"

      - name: Verify (macOS)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          BUNDLE="dist/${APP_NAME}.app"
          if [ -d "$BUNDLE" ]; then
            file "$BUNDLE/Contents/MacOS/${APP_NAME}"
          else
            ls -la dist/
          fi

      - name: Verify (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: |
          ls -la "dist/${APP_NAME}.exe"

      - name: Package
        run: |
          mkdir -p _pkg
          cp -a dist/* _pkg/
          cd _pkg
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "../${APP_NAME}-${{ matrix.os }}.zip" *
          else
            tar czf "../${APP_NAME}-${{ matrix.os }}.tar.gz" *
          fi
          rm -rf ../_pkg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.os }}.tar.gz
            ${{ env.APP_NAME }}-${{ matrix.os }}.zip
          compression-level: 0
          if-no-files-found: warn

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
