name: Build and Release

on:
  release:
    types: [created]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: ZanutaRamdiskExtractor

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        env:
          SKIP_CODESIGN: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: python build.py

      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x "dist/${APP_NAME}"
          file "dist/${APP_NAME}"
          "./dist/${APP_NAME}" --help 2>&1 | head -5 && echo "smoke: OK" || echo "smoke: non-zero exit (expected in headless)"

      - name: Smoke test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          BUNDLE="dist/${APP_NAME}.app"
          if [ -d "$BUNDLE" ]; then
            BINARY="${BUNDLE}/Contents/MacOS/${APP_NAME}"
            if [ -f "$BINARY" ]; then
              chmod +x "$BINARY"
              file "$BINARY"
              "$BINARY" --help 2>&1 | head -5 && echo "smoke: OK" || echo "smoke: non-zero exit"
            else
              echo "Binary not found inside bundle, listing:"
              find "$BUNDLE" -type f -perm +111
            fi
          elif [ -f "dist/${APP_NAME}" ]; then
            file "dist/${APP_NAME}"
            "./dist/${APP_NAME}" --help 2>&1 | head -5 || true
          else
            echo "No build artifact found"
            ls -la dist/
          fi

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          file "dist/${APP_NAME}.exe" || true
          "./dist/${APP_NAME}.exe" --help 2>&1 | head -5 && echo "smoke: OK" || echo "smoke: non-zero exit"

      - name: Package artifact
        run: |
          mkdir -p _package
          cp -a dist/* _package/
          cd _package
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "../${APP_NAME}-${{ matrix.os }}.zip" *
          else
            tar czf "../${APP_NAME}-${{ matrix.os }}.tar.gz" *
          fi
          cd ..
          rm -rf _package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.os }}.tar.gz
            ${{ env.APP_NAME }}-${{ matrix.os }}.zip
          compression-level: 0
          if-no-files-found: warn

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
